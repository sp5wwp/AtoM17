plugins { id 'com.android.application' }

def sdalsaAssets = layout.buildDirectory.dir('generated/sdalsa-assets').get().asFile

android {
    namespace 'org.m17project.atomxl'
    compileSdk 34
    buildFeatures { buildConfig true }
    ndkVersion '26.3.11579264'
    defaultConfig {
        applicationId 'org.m17project.atomxl'
        minSdk 29
        targetSdk 30          // the Atom XL runs Android 11
        versionCode 13
        versionName '0.3.2'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        externalNativeBuild { cmake { arguments "-DSDALSA_ASSET_DIR=${sdalsaAssets.absolutePath.replace(File.separator, '/')}" } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets { main { assets.srcDirs += sdalsaAssets } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // A fixed release key, when given (CI: repository secrets; see .github/workflows/build.yml), so every build installs
    // over the last one. Without it, release builds are signed with the local debug key, as before.
    def ks = System.getenv('ATOM17_KEYSTORE')
    signingConfigs {
        if (ks) {
            fixed {
                storeFile file(ks)
                storePassword System.getenv('ATOM17_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ATOM17_KEY_ALIAS')
                keyPassword System.getenv('ATOM17_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig ks ? signingConfigs.fixed : signingConfigs.debug } }
    lint { abortOnError false; checkReleaseBuilds false }
}

// the assets must be merged after CMake has built sdalsa for the same build type (as SignalDeck does)
tasks.configureEach { t ->
    def m = t.name =~ /^merge(Debug|Release)Assets$/
    if (m.matches()) t.dependsOn("externalNativeBuild${m.group(1)}")
}
